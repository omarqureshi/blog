name: Deploy Blog

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for requesting the JWT
  contents: read  # Required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: blog

      - name: Checkout JSII
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/jsii
          ref: ruby-language-bindings
          path: jsii

      - name: Checkout Constructs
        uses: actions/checkout@v4
        with:
          repository: aws/constructs
          ref: 10.x
          path: constructs

      - name: Checkout AWS CDK
        uses: actions/checkout@v4
        with:
          repository: aws/aws-cdk
          ref: main
          path: aws-cdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache Build Artifacts
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            jsii/node_modules
            constructs/node_modules
            aws-cdk/node_modules
            constructs/dist/ruby
            aws-cdk/packages/aws-cdk-lib/dist/ruby
          key: ${{ runner.os }}-cdk-ruby-build-${{ hashFiles('jsii/yarn.lock', 'constructs/yarn.lock', 'aws-cdk/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cdk-ruby-build-

      - name: Build Blog Site
        working-directory: blog
        run: |
          npm ci
          npm run build

      - name: Build Custom JSII
        if: steps.cache-build.outputs.cache-hit != 'true'
        working-directory: jsii
        run: |
          corepack enable
          yarn install
          yarn build

      - name: Build Constructs Ruby Gem
        if: steps.cache-build.outputs.cache-hit != 'true'
        working-directory: constructs
        run: |
          corepack enable
          yarn install
          yarn build
          jq '.jsii.targets.ruby = {"gem": "constructs", "module": "Constructs"}' package.json > package.json.tmp && mv package.json.tmp package.json
          jq '.targets.ruby = {"gem": "constructs", "module": "Constructs"}' .jsii > .jsii.tmp && mv .jsii.tmp .jsii
          node ../jsii/packages/jsii-pacmak/bin/jsii-pacmak -v -t ruby --force-target -- .

      - name: Build AWS CDK Lib Ruby Gem
        if: steps.cache-build.outputs.cache-hit != 'true'
        working-directory: aws-cdk
        run: |
          corepack enable
          yarn install
          npx lerna run build --scope aws-cdk-lib --include-dependencies
          cd packages/aws-cdk-lib
          jq '.jsii.targets.ruby = {"gem": "aws-cdk-lib", "module": "AWSCDK"}' package.json > package.json.tmp && mv package.json.tmp package.json
          jq '.targets.ruby = {"gem": "aws-cdk-lib", "module": "AWSCDK"}' .jsii > .jsii.tmp && mv .jsii.tmp .jsii
          node ../../../jsii/packages/jsii-pacmak/bin/jsii-pacmak -v -t ruby --force-target -- .

      - name: Link Local Gems
        working-directory: blog/infra
        run: |
          echo "Constructs ruby dist:"
          ls -la ../../constructs/dist/ruby || true
          echo "AWS CDK Lib ruby dist:"
          ls -la ../../aws-cdk/packages/aws-cdk-lib/dist/ruby || true
          
          # Find and unpack constructs gem if only .gem exists
          CONSTRUCTS_DIR="../../constructs/dist/ruby"
          if ls $CONSTRUCTS_DIR/*.gem 1> /dev/null 2>&1; then
            echo "Unpacking constructs gem..."
            gem unpack $CONSTRUCTS_DIR/*.gem --target $CONSTRUCTS_DIR/unpacked
            CONSTRUCTS_PATH=$(ls -d $CONSTRUCTS_DIR/unpacked/*/ | head -n 1 | sed 's/\/$//')
          else
            CONSTRUCTS_PATH="$CONSTRUCTS_DIR/constructs"
          fi
          
          # Find and unpack aws-cdk-lib gem if only .gem exists
          CDK_DIR="../../aws-cdk/packages/aws-cdk-lib/dist/ruby"
          if ls $CDK_DIR/*.gem 1> /dev/null 2>&1; then
            echo "Unpacking aws-cdk-lib gem..."
            gem unpack $CDK_DIR/*.gem --target $CDK_DIR/unpacked
            CDK_PATH=$(ls -d $CDK_DIR/unpacked/*/ | head -n 1 | sed 's/\/$//')
          else
            CDK_PATH="$CDK_DIR/aws-cdk-lib"
          fi
          
          # Escape paths for sed
          CONSTRUCTS_SED_PATH=$(echo $CONSTRUCTS_PATH | sed 's/\//\\\//g')
          CDK_SED_PATH=$(echo $CDK_PATH | sed 's/\//\\\//g')
          
          sed -i "s/gem 'constructs'.*/gem 'constructs', path: '${CONSTRUCTS_SED_PATH}'/" Gemfile
          sed -i "s/gem 'aws-cdk-lib'.*/gem 'aws-cdk-lib', path: '${CDK_SED_PATH}'/" Gemfile
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Install CDK CLI globally
        run: npm install -g aws-cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Deploy CDK Stack
        working-directory: blog/infra
        run: bundle exec cdk deploy --require-approval never
