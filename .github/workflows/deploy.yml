name: Deploy Blog

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for requesting the JWT
  contents: read  # Required for actions/checkout
  packages: read  # Required to download GitHub Packages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: blog

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build Blog Site
        working-directory: blog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build

      - name: Fetch Remote Gems
        working-directory: blog/infra
        env:
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: omarqureshi:${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install
          bundle update jsii-ruby-runtime constructs aws-cdk-lib aws-cdk-asset-awscli-v1 aws-cdk-asset-node-proxy-agent-v6 aws-cdk-cloud-assembly-schema

      - name: Install CDK CLI globally
        run: npm install -g aws-cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Deploy CDK Stack
        working-directory: blog/infra
        env:
          BUNDLE_RUBYGEMS__PKG__GITHUB__COM: omarqureshi:${{ secrets.GITHUB_TOKEN }}
          JSII_RUNTIME: ${{ github.workspace }}/blog/node_modules/@jsii/runtime/bin/jsii-runtime
        run: bundle exec cdk deploy --require-approval never
