name: Publish Pre-release Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight UTC

permissions:
  packages: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout JSII
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/jsii
          ref: ruby-language-bindings
          path: jsii

      - name: Checkout Constructs
        uses: actions/checkout@v4
        with:
          repository: aws/constructs
          ref: 10.x
          path: constructs

      - name: Checkout AWS CDK
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/aws-cdk
          ref: ruby-language-bindings
          path: aws-cdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@omarqureshi'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Authenticate RubyGems
        run: |
          mkdir -p ~/.gem
          cat << EOF > ~/.gem/credentials
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Generate Dynamic Version
        id: version
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "NPM_VERSION=0.0.0-$TIMESTAMP" >> $GITHUB_ENV
          echo "GEM_VERSION=0.0.0.pre.$TIMESTAMP" >> $GITHUB_ENV

      - name: Build JSII
        working-directory: jsii
        run: |
          corepack enable
          yarn install
          yarn build

      - name: Publish Patched NPM Packages to GitHub Packages
        working-directory: jsii
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Publish patched jsii compiler (compiled in node_modules after patch is applied)
          cd node_modules/jsii
          jq ".name = \"@omarqureshi/jsii\" | .version = \"${{ env.NPM_VERSION }}\" | .publishConfig = {\"registry\": \"https://npm.pkg.github.com\"}" package.json > tmp.json && mv tmp.json package.json
          npm publish
          cd ../..

          # 2. Publish patched jsii-rosetta
          cd node_modules/jsii-rosetta
          jq ".name = \"@omarqureshi/jsii-rosetta\" | .version = \"${{ env.NPM_VERSION }}\" | .publishConfig = {\"registry\": \"https://npm.pkg.github.com\"}" package.json > tmp.json && mv tmp.json package.json
          npm publish
          cd ../..

      - name: Publish jsii-ruby-runtime (RubyGem)
        working-directory: jsii/packages/@jsii/ruby-runtime
        run: |
          jq ".version = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          gem build jsii-ruby-runtime.gemspec
          gem push --key github --host https://rubygems.pkg.github.com/omarqureshi *.gem

      - name: Publish constructs (RubyGem)
        working-directory: constructs
        run: |
          corepack enable
          yarn install
          yarn build
          jq ".version = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          jq '.jsii.targets.ruby = {"gem": "constructs", "module": "Constructs"}' package.json > tmp.json && mv tmp.json package.json
          jq ".version = \"${{ env.NPM_VERSION }}\" | .targets.ruby = {\"gem\": \"constructs\", \"module\": \"Constructs\"}" .jsii > tmp.jsii && mv tmp.jsii .jsii
          rm -rf dist/ruby
          node ../jsii/packages/jsii-pacmak/bin/jsii-pacmak -v -t ruby --force-target -- .
          cd dist/ruby
          gem push --key github --host https://rubygems.pkg.github.com/omarqureshi *.gem

      - name: Publish AWS CDK (RubyGems)
        working-directory: aws-cdk
        run: |
          corepack enable

          # Write .npmrc to authenticate and pull @omarqureshi scope from GitHub Packages
          echo "@omarqureshi:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc

          # Update package.json resolutions to point to the newly published dynamic package versions and remove pacmak resolution
          jq ".resolutions.jsii = \"npm:@omarqureshi/jsii@${{ env.NPM_VERSION }}\" | .resolutions[\"jsii-rosetta\"] = \"npm:@omarqureshi/jsii-rosetta@${{ env.NPM_VERSION }}\" | del(.resolutions[\"jsii-pacmak\"])" package.json > tmp.json && mv tmp.json package.json

          env NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }} yarn install
          npx lerna run build --scope aws-cdk-lib --include-dependencies

          # Publish nested dependencies
          ROOT_DIR=$PWD
          for pkg in asset-awscli-v1 asset-node-proxy-agent-v6 cloud-assembly-schema; do
            echo "Publishing dependency: $pkg"
            cd $ROOT_DIR/node_modules/@aws-cdk/$pkg
            jq ".version = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
            GEM_NAME="aws-cdk-$pkg"
            MODULE_NAME=$(echo "$GEM_NAME" | sed -r 's/(^|-)([a-z])/\U\2/g')
            if [ -f .jsii.gz ]; then
              gunzip -c .jsii.gz > tmp_src.jsii
            else
              cp .jsii tmp_src.jsii
            fi
            jq ".version = \"${{ env.NPM_VERSION }}\" | .targets.ruby.gem = \"$GEM_NAME\" | .targets.ruby.module = \"$MODULE_NAME\"" tmp_src.jsii > tmp.jsii && mv tmp.jsii .jsii
            if [ -f .jsii.gz ]; then
              gzip -c .jsii > .jsii.gz
              echo '{"schema":"jsii/file-redirect","compression":"gzip","filename":".jsii.gz"}' > .jsii
            fi
            rm -rf dist/ruby
            node $ROOT_DIR/../jsii/packages/jsii-pacmak/bin/jsii-pacmak -v -t ruby --force-target -- .
            cd dist/ruby
            gem push --key github --host https://rubygems.pkg.github.com/omarqureshi *.gem
          done

          # Publish main lib
          cd $ROOT_DIR/packages/aws-cdk-lib
          jq ".version = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          jq '.jsii.targets.ruby.gem = "aws-cdk-lib" | .jsii.targets.ruby.module = "AWSCDK"' package.json > tmp.json && mv tmp.json package.json
          
          if [ -f .jsii.gz ]; then
            gunzip -c .jsii.gz > tmp_src.jsii
          else
            cp .jsii tmp_src.jsii
          fi
          jq ".version = \"${{ env.NPM_VERSION }}\" | .targets.ruby.gem = \"aws-cdk-lib\" | .targets.ruby.module = \"AWSCDK\"" tmp_src.jsii > tmp.jsii && mv tmp.jsii .jsii
          if [ -f .jsii.gz ]; then
            gzip -c .jsii > .jsii.gz
            echo '{"schema":"jsii/file-redirect","compression":"gzip","filename":".jsii.gz"}' > .jsii
          fi
          rm -rf dist/ruby
          grep '"version"' package.json
          grep '"version"' .jsii || echo "No version in .jsii!"
          node $ROOT_DIR/../jsii/packages/jsii-pacmak/bin/jsii-pacmak -v -t ruby --force-target -- .
          cd dist/ruby
          ls -la
          gem spec *.gem
          gem push --key github --host https://rubygems.pkg.github.com/omarqureshi *.gem
