name: Publish Pre-release Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight UTC

# Serialize against other publishes AND the docs rebuild: the S3 publish step
# does a read-modify-write of the whole gem index, which two concurrent runs
# would corrupt. Same group as publish-docs.yml; never cancel a running publish.
concurrency:
  group: gem-publish
  cancel-in-progress: false

permissions:
  packages: write
  contents: read
  id-token: write # OIDC to assume the AWS role that publishes gems to the public S3 bucket

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production # exposes the AWS_ACCOUNT_ID environment secret used for the S3 publish
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      gem_version: ${{ steps.version.outputs.gem_version }}
    steps:
      - name: Checkout JSII
        uses: actions/checkout@v6
        with:
          repository: omarqureshi/jsii
          # The working branch (fork-compiler scaffolding included); the plain
          # ruby-language-bindings branch is the upstream-facing review artifact
          # and does not install on its own.
          ref: ruby-language-bindings-self-publish
          path: jsii

      - name: Checkout Constructs
        uses: actions/checkout@v6
        with:
          repository: aws/constructs
          ref: 10.x
          path: constructs

      - name: Checkout AWS CDK
        uses: actions/checkout@v6
        with:
          repository: omarqureshi/aws-cdk
          ref: ruby-language-bindings-self-publish
          path: aws-cdk

      # Checkout of THIS repo, for the committed publish config (expected acronyms,
      # constructs/asset-package ruby naming) and post-publish scripts.
      - name: Checkout blog (publish config)
        uses: actions/checkout@v6
        with:
          path: blog

      # Guard: an upstream rebase that resolves the aws-cdk-lib/package.json conflict with
      # `--ours` silently drops or mangles jsii.targets.ruby (module + acronyms). Without
      # acronyms, the generator renders class names like RestApi instead of RestAPI, which
      # breaks consumers (e.g. the blog stack). Compare against the committed expected list
      # (a presence-only check passes on a partially-mangled rebase); fail the publish
      # loudly rather than shipping a broken gem.
      - name: Validate aws-cdk-lib Ruby acronyms
        working-directory: aws-cdk
        run: |
          node -e '
            const expected = require("../blog/.github/publish-config/aws-cdk-lib-ruby-target.json");
            const ruby = require("./packages/aws-cdk-lib/package.json").jsii?.targets?.ruby ?? {};
            const actual = new Set(ruby.acronyms ?? []);
            const want = new Set(expected.acronyms);
            const missing = expected.acronyms.filter((a) => !actual.has(a));
            const extra = [...actual].filter((a) => !want.has(a));
            if (ruby.module !== expected.module || missing.length > 0) {
              console.error(`::error::aws-cdk-lib jsii.targets.ruby diverges from the committed expected list — a rebase likely mangled it. module=${ruby.module} (want ${expected.module}); missing acronyms: ${missing.join(", ") || "none"}. If the change is intentional, update .github/publish-config/aws-cdk-lib-ruby-target.json in the blog repo.`);
              process.exit(1);
            }
            if (extra.length > 0) {
              console.log(`note: ${extra.length} acronym(s) beyond the expected list (fine — new additions): ${extra.join(", ")}`);
            }
            console.log(`aws-cdk-lib ruby target OK: module=${ruby.module}, ${actual.size} acronyms (all ${want.size} expected present)`);
          '

      - name: Checkout JSII Compiler
        uses: actions/checkout@v6
        with:
          repository: omarqureshi/jsii-compiler
          # -self-publish carries fork-republish mechanics (the findPackageJsonUp
          # scoped-name fix) on top of ruby-language-bindings, keeping the plain
          # branch identical to the upstream PR (aws/jsii-compiler#2663) head.
          ref: ruby-language-bindings-self-publish
          path: jsii-compiler

      - name: Checkout JSII Rosetta
        uses: actions/checkout@v6
        with:
          repository: omarqureshi/jsii-rosetta
          ref: ruby-language-bindings
          path: jsii-rosetta

      - name: Checkout JSII Docgen
        uses: actions/checkout@v6
        with:
          repository: omarqureshi/jsii-docgen
          ref: ruby-language-bindings
          path: jsii-docgen


      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@omarqureshi'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Authenticate RubyGems
        run: |
          mkdir -p ~/.gem
          cat << EOF > ~/.gem/credentials
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Generate Dynamic Version
        id: version
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "NPM_VERSION=0.0.0-$TIMESTAMP" >> $GITHUB_ENV
          echo "GEM_VERSION=0.0.0.pre.$TIMESTAMP" >> $GITHUB_ENV
          echo "gem_version=0.0.0.pre.$TIMESTAMP" >> "$GITHUB_OUTPUT"

      # Traceability: 0.0.0.pre.<timestamp> alone says nothing about what was
      # built. Record the exact source SHA of every checkout; uploaded beside the
      # gem index in the S3 publish step as manifests/<version>.json.
      - name: Record source manifest
        run: |
          set -euo pipefail
          node -e '
            const { execSync } = require("child_process");
            const sha = (dir) => execSync(`git -C ${dir} rev-parse HEAD`).toString().trim();
            const manifest = {
              gem_version: process.env.GEM_VERSION,
              npm_version: process.env.NPM_VERSION,
              built_at: new Date().toISOString(),
              workflow_run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              sources: {
                "omarqureshi/jsii": sha("jsii"),
                "omarqureshi/aws-cdk": sha("aws-cdk"),
                "omarqureshi/jsii-compiler": sha("jsii-compiler"),
                "omarqureshi/jsii-rosetta": sha("jsii-rosetta"),
                "omarqureshi/jsii-docgen": sha("jsii-docgen"),
                "aws/constructs": sha("constructs"),
                "omarqureshi/blog": process.env.GITHUB_SHA,
              },
            };
            require("fs").writeFileSync("manifest.json", JSON.stringify(manifest, null, 2));
            console.log(JSON.stringify(manifest, null, 2));
          '

      # Build the Ruby-supporting rosetta fork into a tgz FIRST, so the jsii build
      # below can resolve jsii-rosetta to it. pacmak's ruby target references
      # TargetLanguage.RUBY (compile time) and calls the Ruby visitor (when pacmak
      # runs from the jsii checkout), so jsii — not just aws-cdk — must carry the fork.
      # The fork's Ruby additions don't depend on the patched jsii/@jsii/spec, so it
      # builds standalone against upstream deps.
      - name: Build JSII Rosetta fork (tgz)
        working-directory: jsii-rosetta
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          corepack enable
          # Pin typescript to match jsii 6.x's toolchain.
          jq '.resolutions.typescript = "6.0.3"' package.json > tmp.json && mv tmp.json package.json
          yarn install --no-immutable
          npx projen pre-compile
          npx projen compile
          mkdir -p dist/js
          npm pack
          mv jsii-rosetta-0.0.0.tgz dist/js/jsii-rosetta-0.0.0.tgz

      - name: Build JSII
        working-directory: jsii
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          corepack enable
          yarn config set npmScopes.omarqureshi.npmAuthToken "${NODE_AUTH_TOKEN}"
          # Resolve jsii-rosetta to the fork tgz so pacmak compiles and runs against a
          # rosetta that knows TargetLanguage.RUBY.
          jq '.resolutions["jsii-rosetta"] = "file:../jsii-rosetta/dist/js/jsii-rosetta-0.0.0.tgz"' package.json > tmp.json && mv tmp.json package.json
          yarn install --no-immutable
          yarn build

      - name: Publish Patched NPM Packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          CI: 'false'
        run: |
          # 1. Publish modified @jsii/spec
          cd $GITHUB_WORKSPACE/jsii/packages/@jsii/spec
          jq ".name = \"@omarqureshi/jsii-spec\" | .version = \"${{ env.NPM_VERSION }}\" | .publishConfig = {\"registry\": \"https://npm.pkg.github.com\"}" package.json > tmp.json && mv tmp.json package.json
          npm publish

          # 2. Build and publish jsii-compiler
          cd $GITHUB_WORKSPACE/jsii-compiler
          yarn config set npmScopes.omarqureshi.npmRegistryServer "https://npm.pkg.github.com"
          yarn config set npmScopes.omarqureshi.npmAuthToken "${NODE_AUTH_TOKEN}"
          jq ".resolutions[\"@jsii/spec\"] = \"npm:@omarqureshi/jsii-spec@${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          corepack enable
          yarn install --no-immutable
          npx projen pre-compile
          npx projen compile
          mkdir -p dist/js
          npm pack
          mv jsii-0.0.0.tgz dist/js/jsii-0.0.0.tgz
          jq ".name = \"@omarqureshi/jsii\" | .version = \"${{ env.NPM_VERSION }}\" | .publishConfig = {\"registry\": \"https://npm.pkg.github.com\"} | .dependencies[\"@jsii/spec\"] = \"npm:@omarqureshi/jsii-spec@${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          npm publish

          # 3. Build and publish jsii-rosetta
          cd $GITHUB_WORKSPACE/jsii-rosetta
          yarn config set npmScopes.omarqureshi.npmRegistryServer "https://npm.pkg.github.com"
          yarn config set npmScopes.omarqureshi.npmAuthToken "${NODE_AUTH_TOKEN}"
          jq ".resolutions[\"@jsii/spec\"] = \"npm:@omarqureshi/jsii-spec@${{ env.NPM_VERSION }}\" | .resolutions.jsii = \"npm:@omarqureshi/jsii@${{ env.NPM_VERSION }}\" | .resolutions.typescript = \"6.0.3\"" package.json > tmp.json && mv tmp.json package.json
          corepack enable
          yarn install --no-immutable
          npx projen pre-compile
          npx projen compile
          mkdir -p dist/js
          npm pack
          mv jsii-rosetta-0.0.0.tgz dist/js/jsii-rosetta-0.0.0.tgz
          jq ".name = \"@omarqureshi/jsii-rosetta\" | .version = \"${{ env.NPM_VERSION }}\" | .publishConfig = {\"registry\": \"https://npm.pkg.github.com\"} | .dependencies[\"@jsii/spec\"] = \"npm:@omarqureshi/jsii-spec@${{ env.NPM_VERSION }}\" | .dependencies[\"jsii\"] = \"npm:@omarqureshi/jsii@${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          npm publish

          # 4. Build and publish jsii-docgen
          cd $GITHUB_WORKSPACE/jsii-docgen
          yarn config set npmScopes.omarqureshi.npmRegistryServer "https://npm.pkg.github.com"
          yarn config set npmScopes.omarqureshi.npmAuthToken "${NODE_AUTH_TOKEN}"
          jq ".resolutions[\"@jsii/spec\"] = \"npm:@omarqureshi/jsii-spec@${{ env.NPM_VERSION }}\" | .resolutions.jsii = \"file:../jsii-compiler/dist/js/jsii-0.0.0.tgz\" | .resolutions[\"jsii-rosetta\"] = \"file:../jsii-rosetta/dist/js/jsii-rosetta-0.0.0.tgz\" | .resolutions.typescript = \"6.0.3\"" package.json > tmp.json && mv tmp.json package.json
          rm -f yarn.lock
          corepack enable
          yarn install --no-immutable
          npx projen pre-compile
          npx projen compile
          jq ".name = \"@omarqureshi/jsii-docgen\" | .version = \"${{ env.NPM_VERSION }}\" | .publishConfig = {\"registry\": \"https://npm.pkg.github.com\"} | .dependencies[\"@jsii/spec\"] = \"npm:@omarqureshi/jsii-spec@${{ env.NPM_VERSION }}\" | del(.peerDependencies[\"jsii-rosetta\"]) | .peerDependencies[\"@omarqureshi/jsii-rosetta\"] = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          npm publish

      - name: Publish jsii-ruby-runtime (RubyGem)
        working-directory: jsii/packages/@jsii/ruby-runtime
        run: |
          jq ".version = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          gem build jsii-ruby-runtime.gemspec
          gem push --key github --host https://rubygems.pkg.github.com/omarqureshi *.gem

      - name: Publish constructs (RubyGem)
        working-directory: constructs
        run: |
          corepack enable
          yarn install
          yarn build
          # Naming comes from committed config, not inline literals — the values are
          # published gem/module names (permanent public API).
          RUBY_TARGET=$(jq -c '.constructs' ../blog/.github/publish-config/ruby-targets.json)
          if [ "$RUBY_TARGET" = "null" ]; then
            echo "::error::no ruby-targets.json entry for 'constructs' — add one before publishing"
            exit 1
          fi
          jq ".version = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          jq --argjson t "$RUBY_TARGET" '.jsii.targets.ruby = $t' package.json > tmp.json && mv tmp.json package.json
          jq --argjson t "$RUBY_TARGET" ".version = \"${{ env.NPM_VERSION }}\" | .targets.ruby = \$t" .jsii > tmp.jsii && mv tmp.jsii .jsii
          rm -rf dist/ruby
          node ../jsii/packages/jsii-pacmak/bin/jsii-pacmak -v -t ruby --rosetta-unknown-snippets translate --force-target -- .
          cd dist/ruby
          gem push --key github --host https://rubygems.pkg.github.com/omarqureshi *.gem

      - name: Publish AWS CDK (RubyGems)
        working-directory: aws-cdk
        env:
          TS_NODE_TRANSPILE_ONLY: 'true'
        run: |
          corepack enable

          # Write .npmrc to authenticate and pull @omarqureshi scope from GitHub Packages
          echo "@omarqureshi:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc

          # Update package.json resolutions to point to the newly published dynamic package versions and remove pacmak resolution
          jq ".resolutions.jsii = \"npm:@omarqureshi/jsii@${{ env.NPM_VERSION }}\" | .resolutions[\"jsii-rosetta\"] = \"npm:@omarqureshi/jsii-rosetta@${{ env.NPM_VERSION }}\" | .resolutions[\"@jsii/spec\"] = \"npm:@omarqureshi/jsii-spec@${{ env.NPM_VERSION }}\" | del(.resolutions[\"jsii-pacmak\"])" package.json > tmp.json && mv tmp.json package.json

          env NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }} yarn install
          npx lerna run build --scope aws-cdk-lib --include-dependencies

          # Re-extract the Rosetta tablet with the fork (which supports Ruby) so
          # aws-cdk-lib's .jsii.tabl.json gains Ruby translations. Extraction primes
          # from the shipped tablet, so only the missing Ruby snippets are compiled;
          # pacmak then reads this tablet automatically and emits validated Ruby
          # @example blocks (the --rosetta-unknown-snippets flag stays as a fallback).
          npx lerna run rosetta:extract --scope aws-cdk-lib

          # Publish nested dependencies
          ROOT_DIR=$PWD
          for pkg in asset-awscli-v1 asset-node-proxy-agent-v6 cloud-assembly-schema; do
            echo "Publishing dependency: $pkg"
            cd $ROOT_DIR/node_modules/@aws-cdk/$pkg
            jq ".version = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
            # Naming from committed config (permanent public API — see ruby-targets.json).
            GEM_NAME=$(jq -r ".\"$pkg\".gem" "$GITHUB_WORKSPACE/blog/.github/publish-config/ruby-targets.json")
            MODULE_NAME=$(jq -r ".\"$pkg\".module" "$GITHUB_WORKSPACE/blog/.github/publish-config/ruby-targets.json")
            if [ "$GEM_NAME" = "null" ] || [ "$MODULE_NAME" = "null" ]; then
              echo "::error::no ruby-targets.json entry for '$pkg' — add one before publishing"
              exit 1
            fi
            if [ -f .jsii.gz ]; then
              gunzip -c .jsii.gz > tmp_src.jsii
            else
              cp .jsii tmp_src.jsii
            fi
            jq ".version = \"${{ env.NPM_VERSION }}\" | .targets.ruby.gem = \"$GEM_NAME\" | .targets.ruby.module = \"$MODULE_NAME\"" tmp_src.jsii > tmp.jsii && mv tmp.jsii .jsii
            if [ -f .jsii.gz ]; then
              gzip -c .jsii > .jsii.gz
              echo '{"schema":"jsii/file-redirect","compression":"gzip","filename":".jsii.gz"}' > .jsii
            fi
            rm -rf dist/ruby
            node $ROOT_DIR/../jsii/packages/jsii-pacmak/bin/jsii-pacmak -v -t ruby --rosetta-unknown-snippets translate --force-target -- .
            cd dist/ruby
            gem push --key github --host https://rubygems.pkg.github.com/omarqureshi *.gem
          done

          # Publish main lib
          cd $ROOT_DIR/packages/aws-cdk-lib
          jq ".version = \"${{ env.NPM_VERSION }}\"" package.json > tmp.json && mv tmp.json package.json
          jq '.jsii.targets.ruby.gem = "aws-cdk-lib" | .jsii.targets.ruby.module = "AWSCDK"' package.json > tmp.json && mv tmp.json package.json
          
          if [ -f .jsii.gz ]; then
            gunzip -c .jsii.gz > tmp_src.jsii
          else
            cp .jsii tmp_src.jsii
          fi
          jq ".version = \"${{ env.NPM_VERSION }}\" | .targets.ruby.gem = \"aws-cdk-lib\" | .targets.ruby.module = \"AWSCDK\"" tmp_src.jsii > tmp.jsii && mv tmp.jsii .jsii
          if [ -f .jsii.gz ]; then
            gzip -c .jsii > .jsii.gz
            echo '{"schema":"jsii/file-redirect","compression":"gzip","filename":".jsii.gz"}' > .jsii
          fi
          rm -rf dist/ruby
          grep '"version"' package.json
          grep '"version"' .jsii || echo "No version in .jsii!"
          node $ROOT_DIR/../jsii/packages/jsii-pacmak/bin/jsii-pacmak -v -t ruby --rosetta-unknown-snippets translate --force-target -- .
          cd dist/ruby
          ls -la

          # Single-gem UX: pin the co-published dependency set into the gemspec.
          # pacmak omits assembly deps whose dependencyClosure entries lack
          # targets.ruby (true for the npm-published constructs/asset assemblies
          # baked into aws-cdk-lib's .jsii), and upstream semver ranges could not
          # match the feed's 0.0.0.pre versions anyway. Exact pins to this build's
          # sibling gems make `gem "aws-cdk-lib"` alone resolve the whole set.
          test -f aws-cdk-lib.gemspec || { echo "::error::aws-cdk-lib.gemspec not in dist/ruby — dependency pinning needs it"; exit 1; }
          DEP_PINS=""
          for key in constructs asset-awscli-v1 asset-node-proxy-agent-v6 cloud-assembly-schema; do
            DEP_GEM=$(jq -r ".\"$key\".gem" "$GITHUB_WORKSPACE/blog/.github/publish-config/ruby-targets.json")
            [ "$DEP_GEM" = "null" ] && { echo "::error::no ruby-targets.json entry for '$key'"; exit 1; }
            DEP_PINS="$DEP_PINS  s.add_dependency '$DEP_GEM', '= ${{ env.GEM_VERSION }}'\n"
          done
          sed -i "s/^end\$/${DEP_PINS}end/" aws-cdk-lib.gemspec
          tail -n 8 aws-cdk-lib.gemspec
          rm -f *.gem
          gem build aws-cdk-lib.gemspec

          gem spec *.gem
          gem push --key github --host https://rubygems.pkg.github.com/omarqureshi *.gem

      # ---------------------------------------------------------------------------
      # Publish the same gems to a public S3 bucket serving a static RubyGems repo,
      # so consumers can install with no PAT:  source "https://aws-cdk-ruby-gems.s3.us-east-1.amazonaws.com"
      # (This runs alongside the GitHub Packages push above during migration.)
      # ---------------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Publish gems to public S3 bucket
        run: |
          set -euo pipefail
          BUCKET=aws-cdk-ruby-gems
          REPO_DIR="$GITHUB_WORKSPACE/gem-repo"
          mkdir -p "$REPO_DIR/gems"

          # Pull the existing gems down first so the regenerated index retains prior versions.
          aws s3 sync "s3://$BUCKET/gems/" "$REPO_DIR/gems/" --no-progress

          # Collect every freshly-built .gem (jsii-ruby-runtime + all dist/ruby outputs).
          find "$GITHUB_WORKSPACE" \( -path '*/dist/ruby/*.gem' -o -path '*/ruby-runtime/*.gem' \) \
            -exec cp -f {} "$REPO_DIR/gems/" \;
          echo "Total gems in repository: $(ls "$REPO_DIR/gems" | wc -l)"

          # generate_index (legacy static index) is a plugin in modern RubyGems.
          gem install rubygems-generate_index --no-document
          gem generate_index --directory "$REPO_DIR"

          # Reconciliation guard: every gem built this run (i.e. everything pushed to
          # GitHub Packages above) must appear in the regenerated prerelease index —
          # otherwise the two feeds silently diverge. Fail before uploading anything.
          ruby -rzlib -rstringio -e '
            specs = Marshal.load(Zlib::GzipReader.new(StringIO.new(File.binread("'"$REPO_DIR"'/prerelease_specs.4.8.gz"))).read)
            indexed = specs.map { |name, version, _| "#{name}-#{version}" }
            missing = Dir.glob("'"$REPO_DIR"'/gems/*-'"$GEM_VERSION"'.gem").map { |f| File.basename(f, ".gem") }.reject { |g| indexed.include?(g) }
            abort("::error::gems built this run but absent from the regenerated index: #{missing.join(", ")}") unless missing.empty?
            fresh = indexed.grep(/#{Regexp.escape("'"$GEM_VERSION"'")}/)
            abort("::error::no gems with version '"$GEM_VERSION"' in the index — the build produced nothing?") if fresh.empty?
            puts "index OK: #{fresh.size} gems at '"$GEM_VERSION"' present"
          '

          # Traceability: the source manifest rides beside the index.
          mkdir -p "$REPO_DIR/manifests"
          cp "$GITHUB_WORKSPACE/manifest.json" "$REPO_DIR/manifests/$GEM_VERSION.json"

          # Upload gems + index + manifest to the bucket (private; served via CloudFront).
          aws s3 sync "$REPO_DIR/" "s3://$BUCKET/" --no-progress

          # Post-upload spot check: the freshly built gems must actually be in the bucket.
          for gem_file in "$REPO_DIR"/gems/*-"$GEM_VERSION".gem; do
            key="gems/$(basename "$gem_file")"
            aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null \
              || { echo "::error::$key missing from s3://$BUCKET after sync"; exit 1; }
          done

          # Invalidate the CloudFront cache so consumers see the fresh index immediately.
          # The distribution exists (rubygems.omarqureshi.net is live) — failing to find
          # it means consumers silently serve a stale index, so fail loudly.
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='rubygems.omarqureshi.net']].Id | [0]" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::no CloudFront distribution found for rubygems.omarqureshi.net — consumers will serve a stale index until this is resolved"
            exit 1
          fi
          # Wait for the invalidation so downstream consumers (the smoke test,
          # chained docs build) never race a stale CDN index.
          INV_ID=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$INV_ID"
          echo "Invalidated CloudFront distribution $DIST_ID (invalidation $INV_ID completed)"
          echo "Published to https://rubygems.omarqureshi.net ($GEM_VERSION, manifest: manifests/$GEM_VERSION.json)"

  # Consumer verification of the PUBLIC feed: install the just-published gems
  # exactly as a stranger would (no GitHub auth anywhere) and synthesize a real
  # stack. Until this passes, the publish is unverified; the blog deploy below
  # covers the GitHub Packages channel the same way.
  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GEM_VERSION: ${{ needs.publish.outputs.gem_version }}
    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4' # the oldest-but-one supported line — consumer-realistic

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install from the public feed and synth a stack
        run: |
          set -euo pipefail
          mkdir smoke && cd smoke
          # Single gem, inline source — everything else must arrive transitively
          # via the exact dependency pins the publish job writes into the
          # gemspec. This is the one-line consumer UX we document, so the smoke
          # test exercises exactly that form.
          cat > Gemfile <<EOF
          source "https://rubygems.org"

          gem "aws-cdk-lib", "$GEM_VERSION", source: "https://rubygems.omarqureshi.net"
          EOF
          # The kernel needs the Node sidecar: the gems ship no JS, so install
          # @jsii/runtime locally and point JSII_RUNTIME at it (same pattern as
          # deploy.yml). Bounded retry: the CloudFront invalidation the publish
          # job issues can take a moment to propagate to the compact index.
          npm install @jsii/runtime
          for attempt in 1 2 3; do
            bundle install && break
            [ "$attempt" = "3" ] && { echo "::error::bundle install failed after 3 attempts"; exit 1; }
            echo "bundle install attempt $attempt failed (stale CDN index?) — retrying in 30s"
            sleep 30
          done
          export JSII_RUNTIME="$PWD/node_modules/@jsii/runtime/bin/jsii-runtime"
          cat > synth.rb <<'RB'
          require "aws-cdk-lib"
          require "json"

          app = AWSCDK::App.new
          stack = AWSCDK::Stack.new(app, "SmokeStack")
          AWSCDK::S3::Bucket.new(stack, "SmokeBucket", { versioned: true })
          assembly = app.synth
          template = JSON.parse(File.read(File.join(assembly.directory, "SmokeStack.template.json")))
          types = template.fetch("Resources").values.map { |r| r.fetch("Type") }
          raise "no S3 bucket in synthesized template: #{types.inspect}" unless types.include?("AWS::S3::Bucket")
          puts "smoke OK: synthesized #{types.size} resource(s): #{types.uniq.join(", ")}"
          RB
          bundle exec ruby synth.rb

      - name: Verify the source manifest is served
        run: |
          set -euo pipefail
          curl -fsS -o manifest-check.json "https://rubygems.omarqureshi.net/manifests/$GEM_VERSION.json"
          head -20 manifest-check.json

  # The user-facing consumer test: deploy the blog on the fresh gems (its
  # Gemfile pulls from GitHub Packages, covering the other feed). deploy.yml is
  # dispatched with update_gems=true so it bundle-updates, deploys, and commits
  # the refreshed Gemfile.lock back. GITHUB_TOKEN may create workflow_dispatch
  # events, so no PAT is needed.
  deploy-blog:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch blog deploy on fresh gems
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f update_gems=true
          echo "Dispatched deploy.yml with update_gems=true"
